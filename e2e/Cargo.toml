[package]
name = "vertigo-3d-e2e"
version.workspace = true
edition = "2024"
publish = false

# The library only serves the suites in tests/
[lib]
test = false
doctest = false

[dependencies]
anyhow = "1.0"
# The canvases' screenshots, which show what WebGPU drew as well as WebGL
png = "0.18"
serde_json = "1.0"
thirtyfour = "0.38"
vertigo-3d = { path = ".." }
vertigo-testing = { workspace = true }

[[test]]
name = "storybook"
path = "tests/storybook/main.rs"
harness = false

[lints]
workspace = true
